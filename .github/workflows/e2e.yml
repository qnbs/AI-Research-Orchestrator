# ==============================================================================
# Playwright E2E Workflow
#
# Runs on every push/PR to main. Blocking after 10 consecutive clean CI runs
# (51 passed each) verified 2026-08-01 — see docs/e2e-ci-backlog.md.
# ==============================================================================

name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancel superseded PR runs only — never abort an in-flight main validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        # Call playwright directly — `pnpm run test:e2e -- <files>` leaves a bare `--`
        # that makes Playwright ignore the file list and run the entire testDir
        # (including a11y.spec.ts, which already has its own blocking a11y.yml job).
        run: >-
          pnpm exec playwright test
          src/test/e2e/smoke.spec.ts
          src/test/e2e/agent-flow.spec.ts
          src/test/e2e/dialog-a11y.spec.ts
          src/test/e2e/keyboard-focus.spec.ts
          src/test/e2e/skip-to-content.spec.ts
          src/test/e2e/journal-hub.spec.ts
          src/test/e2e/provider-flow.spec.ts
          src/test/e2e/collections.spec.ts
          src/test/e2e/knowledge-base.spec.ts
          src/test/e2e/orchestrator-checkpoint.spec.ts

      - name: Upload Playwright report
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
