# ==============================================================================
# Cross-browser Playwright smoke matrix (audit P1-6)
#
# Non-blocking: Firefox, WebKit, and mobile Chrome run smoke.spec.ts only.
# Promotion criteria: docs/e2e-ci-backlog.md
# ==============================================================================

name: E2E Cross-Browser Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  cross-browser-smoke:
    name: "Smoke (${{ matrix.browser }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, mobile-chrome]

    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: |
          target="${{ matrix.browser }}"
          if [ "$target" = "mobile-chrome" ]; then
            target="chromium"
          fi
          pnpm exec playwright install --with-deps "$target"

      - name: Run cross-browser E2E suite
        env:
          PLAYWRIGHT_MATRIX: "1"
        run: >-
          pnpm exec playwright test
          src/test/e2e/smoke.spec.ts
          src/test/e2e/agent-flow.spec.ts
          src/test/e2e/dialog-a11y.spec.ts
          src/test/e2e/keyboard-focus.spec.ts
          src/test/e2e/skip-to-content.spec.ts
          src/test/e2e/journal-hub.spec.ts
          src/test/e2e/provider-flow.spec.ts
          --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
