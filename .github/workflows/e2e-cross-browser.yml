# ==============================================================================
# Cross-browser Playwright suite (audit P1-6 → blocking 2026-08-03)
#
# Blocking: Firefox, WebKit, and mobile Chrome run the same seven-spec list as
# Chromium e2e.yml. fail-fast is false so all browsers still report. A green
# check means every matrix leg passed (no continue-on-error mask).
# History / streak notes: docs/e2e-ci-backlog.md
#
# Install hardening (2026-08-03): main tip 2d8d4f9 WebKit was cancelled at the
# job timeout while `playwright install --with-deps` crawled apt mirrors — not a
# test failure. Cache browser binaries, retry OS-deps install, longer job budget.
# ==============================================================================

name: E2E Cross-Browser Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancel superseded PR runs only — never abort an in-flight main validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-browser-smoke:
    name: "Cross-browser (${{ matrix.browser }})"
    runs-on: ubuntu-24.04
    # WebKit --with-deps can spend 20+ minutes on slow apt mirrors; leave headroom
    # for the seven-spec suite after a cold install.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, mobile-chrome]

    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright browser target
        id: pw
        run: |
          target="${{ matrix.browser }}"
          if [ "$target" = "mobile-chrome" ]; then
            target="chromium"
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # actions/cache@v6.1.0 — browser binaries only (~/.cache/ms-playwright)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw.outputs.target }}-

      - name: Install Playwright browser and OS deps
        # Split browser download (cacheable) from apt OS deps; retry on apt stalls.
        run: |
          set -euo pipefail
          target="${{ steps.pw.outputs.target }}"
          max=3
          attempt=1
          while true; do
            echo "::group::Playwright install attempt ${attempt}/${max} (target=${target})"
            if pnpm exec playwright install "$target" \
              && pnpm exec playwright install-deps "$target"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -ge "$max" ]; then
              echo "Playwright install failed after ${max} attempts" >&2
              exit 1
            fi
            echo "Install attempt ${attempt} failed; refreshing apt and retrying in 25s..."
            attempt=$((attempt + 1))
            sudo apt-get update -y || true
            sleep 25
          done

      - name: Run cross-browser E2E suite
        env:
          PLAYWRIGHT_MATRIX: "1"
        run: >-
          pnpm exec playwright test
          src/test/e2e/smoke.spec.ts
          src/test/e2e/agent-flow.spec.ts
          src/test/e2e/dialog-a11y.spec.ts
          src/test/e2e/keyboard-focus.spec.ts
          src/test/e2e/skip-to-content.spec.ts
          src/test/e2e/journal-hub.spec.ts
          src/test/e2e/provider-flow.spec.ts
          --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
