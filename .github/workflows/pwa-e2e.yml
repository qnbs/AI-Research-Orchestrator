# ==============================================================================
# PWA Service-Worker Registration E2E Workflow
#
# Regression guard for the 531885f defect (ADR 0004, 2026-08-05 amendment):
# register-sw.js derives its registration scope from a <base href> tag that,
# for a time, no build step ever injected - navigator.serviceWorker.register()
# silently called register('/sw.js', { scope: '/' }) in production, swallowed
# by an intentional empty .catch(). Build-time checks (the assertion in
# scripts/generate-deployment-artifacts.mjs) only prove the <base> tag is
# present in dist/index.html - they cannot prove registration itself
# succeeds, that the controller becomes active, or that the offline app
# shell actually works. This workflow runs the dedicated Playwright PWA lane
# (playwright.pwa.config.ts) against a real production build + `vite
# preview` served under the GitHub Pages subpath, with service workers
# enabled (unlike e2e.yml/e2e-cross-browser.yml, which block them).
#
# Blocking from creation (2026-08-05) - this is the decisive proof for an
# already-occurred production incident, not a new feature under
# observation. See docs/ci-branch-governance.md.
# ==============================================================================

name: PWA E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancel superseded PR runs only — never abort an in-flight main validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pwa-e2e:
    name: PWA service-worker registration
    runs-on: ubuntu-24.04
    # First real run (PR #221) completed in 1m12s end to end. 20 min still
    # leaves comfortable headroom against the apt-mirror-driven Chromium
    # install slowness docs/ci-branch-governance.md records for other lanes.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run PWA registration E2E (production build + vite preview)
        run: pnpm run test:e2e:pwa

      - name: Upload Playwright report
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pwa-e2e-report
          path: playwright-report/
          retention-days: 14
