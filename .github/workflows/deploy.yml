# ==============================================================================
# GitHub Pages Deployment Workflow for Vite + React PWA
#
# PR/main: quality gates (lint, typecheck, tests, build)
# main only: Pages upload + deploy
# ==============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancel superseded PR runs only — never abort an in-flight main validation/deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Setup Node.js
        # actions/setup-node@v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm major version
        run: |
          pnpm --version
          pnpm --version | grep -E '^11\.'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit ignore path guard
        run: pnpm run check:audit-ignore-paths

      - name: Type check
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Prettier format check
        run: pnpm run format:check

      - name: Conflict marker check
        run: pnpm run check:conflict-markers

      - name: I18n ratchet
        run: pnpm run i18n:ratchet

      - name: Docs drift check
        run: pnpm run check:docs-drift

      - name: Tests with coverage
        run: pnpm run test:coverage

      - name: Critical-path coverage floors
        run: pnpm run check:coverage-floors

      - name: Logging redaction gate
        run: pnpm run check:log-redaction

      - name: CSP endpoint drift gate
        run: pnpm run check:csp-endpoint-drift

      - name: Agent eval gate
        run: pnpm run check:agent-eval

      - name: Upload coverage artifact
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        # codecov/codecov-action@v5.5.5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          name: vitest-unit
          slug: qnbs/AI-Research-Orchestrator
          fail_ci_if_error: true
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        # codecov/test-results-action@v1.2.1
        uses: codecov/test-results-action@09d1c06c1c296f73924156ae27fef9b32c92a911
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: unit
          fail_ci_if_error: false

  build:
    name: Production Build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Setup Node.js
        # actions/setup-node@v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /AI-Research-Orchestrator/
          VITE_SITE_ORIGIN: https://qnbs.github.io
          # Org secret — Node-only for @codecov/vite-plugin. Never VITE_*.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Bundle budget
        run: pnpm run bundle:budget

      - name: No disallowed CDN scripts (ADR 0011)
        run: pnpm run check:no-cdn-scripts

      - name: No self-hosted Workbox vendor drift (ADR 0004/WS-B)
        run: pnpm run check:workbox-vendor-drift

      - name: WCAG 2.2 AA contrast + FOUC bootstrap parity (WS-D)
        run: pnpm run check:contrast

      - name: Setup SPA routing
        run: cp dist/index.html dist/404.html

      - name: Lighthouse CI
        run: node scripts/run-lighthouse.mjs
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /AI-Research-Orchestrator/
          VITE_SITE_ORIGIN: https://qnbs.github.io

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # actions/configure-pages@v6
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # actions/upload-pages-artifact@v5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: "./dist"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v5
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  prune-deployments:
    name: Prune old deployments
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      deployments: write
    steps:
      - name: Keep latest 3 deployments per environment
        # actions/github-script@v9
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const KEEP = 3;

            const allDeployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            const byEnv = {};
            for (const dep of allDeployments) {
              const env = dep.environment || 'unknown';
              (byEnv[env] ??= []).push(dep);
            }

            let totalDeleted = 0;
            let totalFailed = 0;

            for (const [env, deps] of Object.entries(byEnv)) {
              const sorted = deps.sort((a, b) => b.id - a.id);
              const toDelete = sorted.slice(KEEP);

              if (toDelete.length === 0) {
                core.info(`[${env}] Nothing to prune — only ${deps.length} deployment(s).`);
                continue;
              }

              core.info(
                `[${env}] ${deps.length} total → pruning ${toDelete.length}, keeping ${KEEP} latest.`,
              );

              let deleted = 0;
              let failed = 0;
              for (const dep of toDelete) {
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: dep.id,
                    state: 'inactive',
                  });
                } catch (e) {
                  core.warning(`[${env}] Could not inactivate ${dep.id}: ${e.message}`);
                }

                try {
                  await github.rest.repos.deleteDeployment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: dep.id,
                  });
                  deleted++;
                } catch (e) {
                  core.warning(`[${env}] Could not delete ${dep.id}: ${e.message}`);
                  failed++;
                }
              }

              core.info(`[${env}] Done: ${deleted} deleted, ${failed} failed.`);
              totalDeleted += deleted;
              totalFailed += failed;
            }

            core.info(`All environments: ${totalDeleted} deleted, ${totalFailed} failed.`);

            if (totalFailed > 0) {
              core.setFailed(`${totalFailed} deployment deletion(s) failed — see logs above.`);
            }
