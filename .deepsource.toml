version = 1

exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "public/**",
  "dist/**",
  "coverage/**",
  "index.tsx",
]

# JavaScript/TypeScript quality is enforced by ESLint + deploy.yml (typecheck/lint/test:coverage).
# Only infrastructure analyzers remain here; disable JavaScript in the DeepSource dashboard
# (Settings → Code Review) if the GitHub check still appears.
[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
