version = 1

# TypeScript/JavaScript quality is gated by ESLint 9 + tsc in deploy.yml — not DeepSource JS.
# The DeepSource JavaScript analyzer reports hundreds of false positives (JS-0125 ESM exports,
# complexity antipatterns). We disable it in TOML and exclude application TS so the GitHub
# "DeepSource: JavaScript" check stays green even when the dashboard analyzer is still on.
# See docs/deepsource-javascript-ci.md and docs/deepsource-dashboard-off.md.

exclude_patterns = [
  ".devcontainer/**",
  ".github/**",
  "eslint-local-rules/**",
  "scripts/**",
  "scripts/*.mjs",
  "public/**",
  "dist/**",
  "coverage/**",
  "src/**",
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.mjs",
  "**/*.cjs",
  "vite.config.ts",
  "vitest.config.ts",
  "playwright.config.ts",
  "eslint.config.js",
  "postcss.config.js",
  "lighthouserc.cjs",
  "index.html",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  dialect = "typescript"
  module_system = "es-modules"
  environment = ["browser", "nodejs", "vitest"]
  cyclomatic_complexity_threshold = "critical"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
