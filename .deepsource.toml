version = 1

exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "public/**",
  "dist/**",
  "coverage/**",
  "index.tsx",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  module_system = "es-modules"
  dialect = "typescript"
  dependency_file_paths = ["."]
  environment = ["browser", "nodejs", "vitest", "cypress"]
  cyclomatic_complexity_threshold = "critical"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]
