version = 1

# TypeScript/JavaScript quality is gated by ESLint 9 + tsc in deploy.yml — not DeepSource JS.
# Dashboard JavaScript analyzer is off (2026-11-04). TOML mirrors that with enabled = false.
# Docker + Shell stay enabled; exclude only dev Dockerfile noise — not .devcontainer/postCreate.sh.

exclude_patterns = [
  ".devcontainer/Dockerfile",
  "eslint-local-rules/**",
  "scripts/**",
  "scripts/*.mjs",
  "public/sw.js",
  "public/register-sw.js",
  "public/**",
  "dist/**",
  "coverage/**",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "javascript"
enabled = false

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
