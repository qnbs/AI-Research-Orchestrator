version = 1

# TypeScript/JavaScript quality is gated by ESLint 9 + tsc in deploy.yml — not DeepSource JS.
# Dashboard JavaScript analyzer is off (2026-11-04). TOML mirrors that with enabled = false
# and TS/JS excludes as belt-and-suspenders. ESLint + tsc remain authoritative.

exclude_patterns = [
  ".devcontainer/**",
  ".github/**",
  "eslint-local-rules/**",
  "scripts/**",
  "scripts/*.mjs",
  "public/**",
  "dist/**",
  "coverage/**",
  "src/**",
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.mjs",
  "**/*.cjs",
  "vite.config.ts",
  "vitest.config.ts",
  "playwright.config.ts",
  "eslint.config.js",
  "postcss.config.js",
  "lighthouserc.cjs",
  "index.html",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "javascript"
enabled = false

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
