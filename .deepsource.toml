version = 1

# Node maintenance scripts and service-worker bundles are excluded when the JS analyzer
# is enabled — the analyzer parses some paths as script (not module) and reports false
# JS-0833 / Workbox-global noise. See docs/deepsource-javascript-ci.md.
exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "scripts/*.mjs",
  "scripts/lib/**",
  "public/sw.js",
  "public/register-sw.js",
  "public/**",
  "dist/**",
  "coverage/**",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

# JavaScript analyzer disabled (2026-08-02): persistent false positives on TypeScript
# ESM `export function` (treated as global-scope pollution), scripts/*.mjs module parse
# errors when nested under scripts/lib/, and medium cyclomatic-complexity antipattern
# churn that fails the DeepSource quality gate on every PR — while ESLint 9 (zero
# warnings), typecheck, and deploy.yml are the authoritative TS/TSX gates.
[[analyzers]]
name = "javascript"
enabled = false
