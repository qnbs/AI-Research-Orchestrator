version = 1

# Node maintenance scripts and the Vite entry live outside src/ — ESLint/typecheck cover app code.
exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "public/**",
  "dist/**",
  "coverage/**",
  "index.tsx",
]

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  module_system = "es-modules"
  dialect = "typescript"
  dependency_file_paths = ["."]
  environment = ["browser", "nodejs", "vitest", "cypress"]
  cyclomatic_complexity_threshold = "high"
  test_patterns = ["**/*.{test,spec}.{ts,tsx}"]
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]
