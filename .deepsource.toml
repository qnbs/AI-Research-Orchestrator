version = 1

# Docker + Shell analyzers only. JavaScript analyzer activation is controlled via the
# DeepSource dashboard (Settings → Code Review → Analyzers) — not by a TOML block.
# See docs/deepsource-javascript-ci.md and docs/deepsource-dashboard-off.md.

exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "scripts/*.mjs",
  "public/sw.js",
  "public/register-sw.js",
  "public/**",
  "dist/**",
  "coverage/**",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
