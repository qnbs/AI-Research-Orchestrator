version = 1

# TypeScript/JavaScript quality is gated by ESLint 9 + tsc in deploy.yml — not DeepSource JS.
# The DeepSource JavaScript analyzer reports hundreds of false positives (JS-0125 ESM exports,
# complexity antipatterns). We disable it in TOML and exclude application TS so the GitHub
# "DeepSource: JavaScript" check stays green even when the dashboard analyzer is still on.
# See docs/deepsource-javascript-ci.md and docs/deepsource-dashboard-off.md.

exclude_patterns = [
  ".devcontainer/Dockerfile",
  "eslint-local-rules/**",
  "scripts/**",
  "scripts/*.mjs",
  "public/sw.js",
  "public/register-sw.js",
  "public/**",
  "dist/**",
  "coverage/**",
  "src/**",
  "**/*.ts",
  "**/*.tsx",
  "vite.config.ts",
  "vitest.config.ts",
  "playwright.config.ts",
  "eslint.config.js",
  "lighthouserc.cjs",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "javascript"
enabled = false

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
