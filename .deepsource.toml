version = 1

# Node maintenance scripts use ESM .mjs — ESLint/typecheck cover app code; exclude from JS analyzer.
exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "public/**",
  "dist/**",
  "coverage/**",
]

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  module_system = "es-modules"
  dialect = "typescript"
  environment = ["browser", "nodejs", "vitest", "cypress"]
  cyclomatic_complexity_threshold = "high"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]
