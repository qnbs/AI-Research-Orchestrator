version = 1

# Node maintenance scripts and service-worker bundles are excluded — the JS analyzer
# parses them as script (not module) and reports false JS-0833 / workbox-global noise.
exclude_patterns = [
  "eslint-local-rules/**",
  "scripts",
  "scripts/**",
  "scripts/*.mjs",
  "public/sw.js",
  "public/register-sw.js",
  "public/**",
  "dist/**",
  "coverage/**",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  module_system = "es-modules"
  dialect = "typescript"
  dependency_file_paths = ["."]
  environment = ["browser", "nodejs", "vitest", "cypress", "serviceworker"]
  cyclomatic_complexity_threshold = "critical"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]
