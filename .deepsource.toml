version = 1

# Node maintenance scripts and the Vite entry live outside src/ — ESLint/typecheck are authoritative.
exclude_patterns = [
  "eslint-local-rules/**",
  "scripts/**",
  "public/**",
  "dist/**",
  "coverage/**",
  "index.tsx",
]

# Docker + Shell only. JavaScript analyzer disabled: persistent false positives on TS ESM
# exports and Node .mjs scripts despite module_system/dialect tuning; core CI gates cover JS/TS.
[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "javascript"
enabled = false
