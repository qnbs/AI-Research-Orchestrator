packages:
  - '.'
allowBuilds:
  '@google/genai': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

autoInstallPeers: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - ws@8.20.1
  - protobufjs@7.5.8
  - brace-expansion@5.0.6
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - dompurify@3.4.7
  - dompurify@3.4.6
  - dompurify@3.4.9
  - dompurify@3.4.8
  - undici@7.28.0
  - undici@7.29.0
  - dompurify@3.4.11
  - dompurify@3.4.16
  - dompurify@3.4.17
  - '@lhci/cli@0.16.0'
  - '@lhci/utils@0.16.0'
  - vite@8.3.3
  - js-yaml@4.1.2
  - nanoid@3.3.18
  - ws@8.21.0
  - protobufjs@7.6.1
  - protobufjs@7.6.3
  - '@babel/core@7.29.1'
  - framer-motion@13.2.0
  - framer-motion@13.4.6
  - framer-motion@13.5.0
  - '@anthropic-ai/sdk@0.130.0'
  - '@anthropic-ai/sdk@0.131.0'
  - '@google/genai@2.26.0'
  - ip-address@10.7.4
onlyBuiltDependencies:
  - '@google/genai'
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - protobufjs
  - sharp
peerDependencyRules:
  allowedVersions:
    typescript: '6.0.3'
  ignoreMissing:
    - '@types/node'
strictPeerDependencies: true

overrides:
  vite: 8.3.3
  # GHSA-4cwx-7wf7-3272 (<7.29.0), GHSA-2m5v-pch6-74hx / GHSA-qrxm-fqhp-jwvm (<7.30.1)
  undici: 7.30.1
  # GHSA-jqcg-44mw-7w3h: @lhci/cli > express > proxy-addr (CI-only)
  proxy-addr: 2.0.8
  # @puppeteer/browsers@3.2.6 (via lighthouse/puppeteer-core) peers proxy-agent >=8.0.1;
  # @lhci/cli declares ^6.5.0. Pin exact 8.0.1 so strictPeerDependencies + Dependabot
  # lockfile-only resolution succeed (see docs/deepsource-disposition.md §2026-11-04).
  proxy-agent: 8.0.1
  # GHSA-vc2v-76pw-4v95: @lhci/cli > compression (CI-only)
  compression: 1.8.2
  # GHSA-27r3-jxmh-p828: @lhci/cli > express > body-parser (CI-only)
  body-parser: 1.20.9
  # GHSA-mrhx-c7xc-m3w5: provider/eslint peer zod trees (runtime + dev tooling)
  zod: 4.6.6
  ws: 8.21.1
  # GHSA-mwp4-54f8-5fhr: Address4 decodes leading-zero octets as decimal while
  # resolvers decode them as octal (SSRF/trust-boundary bypass). Transitive via
  # @lhci/cli's puppeteer-core > proxy-agent > socks chain.
  ip-address: 10.7.4
  # GHSA-6g55-p6wh-862q (incomplete fix, <=8.5.22): attacker-controlled
  # sourceMappingURL reads arbitrary .map files when `from` is unset.
  postcss: 8.5.25
  # GHSA-f38q-mgvj-vph7 (<=7.6.2) + GHSA-j3f2-48v5-ccww (<=7.6.4); @google/genai's own
  # range is ^7.5.4, satisfied by 7.6.5
  protobufjs: 7.6.5
  # GHSA-mh99-v99m-4gvg: DoS via unbounded expansion — three independent major
  # lines in the tree need separate pins (minimatch@3 → ^1.1.7, minimatch@9 →
  # ^2.0.2, minimatch@10 → ^5.0.0 via @vitest/coverage-v8 / typescript-eslint).
  'brace-expansion@^1.1.7': 1.1.21
  'brace-expansion@^2.0.2': 2.1.4
  'brace-expansion@^5.0.0': 5.0.11
  # GHSA (jspdf): fflate <=0.8.2 — patch 0.8.3 (production PDF export path).
  'fflate@^0.8.0': 0.8.3
  # GHSA-w5hq-g745-h8pq: @lhci/cli pins uuid@8.3.2 directly
  uuid: 11.1.1
  # @lhci/cli pulls tmp@0.0.33 / 0.1.0 (GHSA-ph9p-34f9-6g65); pin patched release
  tmp: 0.2.7
  # GHSA-c475-qrg2-pj4r (<=6.2.0): DoS in Client.list() RE_LINE backtracking.
  # Transitive via @lhci/cli → lighthouse/puppeteer → proxy-agent → get-uri → basic-ftp.
  basic-ftp: 6.2.1
  # GHSA-5p4m-2wfm-xmqj, the same weakness tracked as CVE-2026-59870:
  # quadratic CPU consumption in !!omap resolution. Two independent major
  # lines in the tree need separate pins (js-yaml@3 via @lhci/utils,
  # js-yaml@4 via @eslint/eslintrc).
  'js-yaml@^3.13.1': 3.15.2
  'js-yaml@^4.1.1': 4.3.2
  # GHSA-2v37-7h3g-55p8: custom generators can loop indefinitely when size is
  # zero. Transitive via postcss (Tailwind / Vite / Vitest).
  nanoid: 3.3.18
  # CVE-2026-73089 / GHSA-c83g-rgw3-j3cx — unbounded result/parse caches
  # (CWE-770). CVE-2026-73088 / GHSA-73wf-gq98-2v4g — uncaught crash /
  # prototype write in normalizeStats() on untrusted browserslist-stats.json
  # (CWE-1321). Both: affected ≤4.28.6, patched 4.28.7. Pin latest patched
  # 4.28.8 (2026-08-08 kaios query fix on top of the security release).
  # Verified in 4.28.8: CACHE_MAX_ENTRIES=500 + boundedCacheSet; normalizeStats
  # uses Object.create(null) + Object.prototype.hasOwnProperty.call.
  # Transitive via autoprefixer and eslint-plugin-react-hooks → @babel/core
  # (dev-only; not in the production PWA bundle). Pin, not a GHSA ignore.
  browserslist: 4.28.8

# @lhci/cli@0.16.0 no longer pulls extract-zip; prior GHSA ignores removed (2026-11-03).
auditConfig:
  ignoreGhsas: []
