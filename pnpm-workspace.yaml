packages:
  - '.'
allowBuilds:
  '@google/genai': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

autoInstallPeers: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - ws@8.20.1
  - protobufjs@7.5.8
  - brace-expansion@5.0.6
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - dompurify@3.4.7
  - dompurify@3.4.6
  - dompurify@3.4.9
  - dompurify@3.4.8
  - undici@7.28.0
  - undici@7.29.0
  - dompurify@3.4.11
  - js-yaml@4.1.2
  - nanoid@3.3.18
  - ws@8.21.0
  - protobufjs@7.6.1
  - protobufjs@7.6.3
  - '@babel/core@7.29.1'
  - ip-address@10.4.0
onlyBuiltDependencies:
  - '@google/genai'
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - protobufjs
  - sharp
peerDependencyRules:
  allowedVersions:
    typescript: '5.8.3'
  ignoreMissing:
    - '@types/node'
strictPeerDependencies: true

overrides:
  vite: 8.1.5
  # GHSA-4cwx-7wf7-3272 (<7.29.0), transitive via jsdom>vitest coverage tooling
  undici: 7.29.0
  ws: 8.21.1
  # GHSA-mwp4-54f8-5fhr: Address4 decodes leading-zero octets as decimal while
  # resolvers decode them as octal (SSRF/trust-boundary bypass). Transitive via
  # @lhci/cli's puppeteer-core > proxy-agent > socks chain.
  ip-address: 10.4.0
  # GHSA-6g55-p6wh-862q (incomplete fix, <=8.5.22): attacker-controlled
  # sourceMappingURL reads arbitrary .map files when `from` is unset.
  postcss: 8.5.25
  # GHSA-f38q-mgvj-vph7 (<=7.6.2) + GHSA-j3f2-48v5-ccww (<=7.6.4); @google/genai's own
  # range is ^7.5.4, satisfied by 7.6.5
  protobufjs: 7.6.5
  # GHSA-mh99-v99m-4gvg: DoS via unbounded expansion — three independent major
  # lines in the tree need separate pins (minimatch@3 → ^1.1.7, minimatch@9 →
  # ^2.0.2, minimatch@10 → ^5.0.0 via @vitest/coverage-v8 / typescript-eslint).
  'brace-expansion@^1.1.7': 1.1.18
  'brace-expansion@^2.0.2': 2.1.4
  'brace-expansion@^5.0.0': 5.0.9
  # GHSA-w5hq-g745-h8pq: @lhci/cli pins uuid@8.3.2 directly
  uuid: 11.1.1
  # @lhci/cli pulls tmp@0.0.33 / 0.1.0 (GHSA-ph9p-34f9-6g65); pin patched release
  tmp: 0.2.7
  # GHSA-5p4m-2wfm-xmqj, the same weakness tracked as CVE-2026-59870:
  # quadratic CPU consumption in !!omap resolution. Two independent major
  # lines in the tree need separate pins (js-yaml@3 via @lhci/utils,
  # js-yaml@4 via @eslint/eslintrc).
  'js-yaml@^3.13.1': 3.15.1
  'js-yaml@^4.1.1': 4.3.1
  # GHSA-2v37-7h3g-55p8: custom generators can loop indefinitely when size is
  # zero. Transitive via postcss (Tailwind / Vite / Vitest).
  nanoid: 3.3.18
  # GHSA-c83g-rgw3-j3cx (unbounded memory via distinct query results) +
  # GHSA-73wf-gq98-2v4g (prototype write via untrusted browserslist-stats.json).
  # Transitive via autoprefixer and eslint-plugin-react-hooks → @babel/core.
  # Patched releases start at 4.28.7; pin current patched 4.28.8 (2026-08-08).
  browserslist: 4.28.8

# extract-zip (GHSA-jmr9-qjv8-65gv / CVE-2026-56876): npm has no patched
# release (latest still 2.0.1; the advisory's ">=2.0.2" pin does not exist).
# The package is abandoned. The only path in this tree is @lhci/cli →
# lighthouse → puppeteer-core → @puppeteer/browsers unpacking Chrome for
# Lighthouse CI — never the production PWA bundle. Ignore until LHCI moves
# off extract-zip or a compatible patched distro is published. Do not treat
# this as a license to ignore other highs. `pnpm run check:audit-ignore-paths`
# fails CI if this GHSA appears on any other path or the exception goes stale.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
